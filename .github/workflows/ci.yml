name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Check JavaScript size
        run: |
          node --input-type=module <<'NODE'
          import { readdirSync, readFileSync } from 'node:fs';
          import { gzipSync } from 'node:zlib';
          const files = readdirSync('dist/assets').filter((file) => file.endsWith('.js'));
          if (files.length === 0) throw new Error('No built JavaScript found');
          const bytes = files.reduce((sum, file) => sum + gzipSync(readFileSync(`dist/assets/${file}`)).length, 0);
          console.log(`JavaScript: ${(bytes / 1000).toFixed(2)} kB gzip (limit 80 kB)`);
          if (bytes > 80_000) process.exit(1);
          NODE
